<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>else Statement</title>
  </head>
  <body>
    <script>
      //  else  Statement

      // if (conditionl) {
      //  DO SOMETHING
      // }

      // else{
      //  DO SOMETHING ELSE
      // }


      // Examples

      let age = 18;

      if(age >= 20){
        console.log("You can drive");
      }

      else{
        console.log("You cannot drive");
      }


        // Traffic Light System

       let color = "red";


        if(color === "red"){
            console.log("Stop!");
        }


        else if(color === "green"){
            console.log("Go");
        }

        else if(color === "yellow"){
            console.log("Be ready");
        }

        else {
            console.log("Invalid color");
        }
    </script>
  </body>
</html>
