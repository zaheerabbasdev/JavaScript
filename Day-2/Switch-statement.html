<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Statement</title>
</head>
<body>
    <script>
        let color = "pink";

        switch(color){

            case "red":
                
                console.log("Stop!");
                break;


            case "green":
                console.log("Go");
                break;


            case "yellow":
                console.log("Be Ready");
                break;  


            default:
                console.log("Not a valid color");    

        }
    </script>
</body>
</html>
