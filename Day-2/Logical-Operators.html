<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logical Operators</title>
  </head>
  <body>
    <script>
      // Note:
      // if there is a lot of logical operators in a given operation so then we start from the left side.
      // Logical AND Operator (&&)

      // Examples

      true && true;
      true;

      true && false;
      false;

      false && true;
      false;

      false && false;
      false(8 > 2) && 5 > 1;
      true;

      // Logical OR Operator (||)

      // Examples

      true || true;
      true;

      true || false;
      true;

      false || true;
      true;

      false || false;
      false(8 > 2) || 5 > 1;
      true;

      // Logical NOT Operator (!)

      // Examples

      !true;
      false;

      !false;
      true;
    </script>
  </body>
</html>
