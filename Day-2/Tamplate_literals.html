<body>
    <h1>Tamplate Literals</h1>
    <h2>Definition: They are used to add embedded expressions in a string.</h2>



    <script>
        let chipsPrice = 10;
        let ChanachorPrice = 20;

        // output = "The total price is : " + (chipsPrice + ChanachorPrice) + " Rupees. ";
        let output = `The total price is : ${chipsPrice + ChanachorPrice} Rupees`;

        console.log(output);
    </script>
