<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nested if else Statement</title>
  </head>
  <body>
    <script>
      

      let marks = 45;

      if(marks >= 33){
        console.log("Pass")

        if(marks >= 50){
            console.log("Grade is Outstanding");
        }

        else{
            console.log("The is Amazing");
        }
      }

      else{
        console.log("Fail");
      }

    </script>
  </body>
</html>
