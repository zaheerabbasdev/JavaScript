<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Exercise-2</title>

  <body>
    <script>
      // Question. Create a system to calculate popcorn prices based on the size customer asked for :

      // if size is 'XL', price is Rs. 250
      // if size is 'L', price is Rs. 200
      // if size is 'M', price is Rs. 100
      // if size is 'S', price is Rs. 50

      let size = "XL";

      if(size === "XL"){
        console.log("The price is : 250");
      }

      else if(size === "L"){
        console.log("The price is : 200");
      }

      else if(size === "M"){
        console.log("The price is : 100");
      }

      else{
        console.log("The price is : 50");
      }
    </script>
  </body>
</html>
